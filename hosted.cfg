modparam("rr", "enable_double_rr", 2)

debug=2
log_stderror=no
log_facility=LOG_LOCAL0

# Main request routing logic
request_route {
    # Check if request is on WebSocket ports but not using correct protocol
    if ((($Rp == 8080 || $Rp == 7443) && !(proto == WS || proto == WSS))) {
        if ($rm == "GET" && $hdr(Upgrade) =~ "websocket") {
            return;
        }
        xlog("L_WARN", "SIP request received on $Rp but not WebSocket protocol\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    
    xlog("L_INFO", "Processing $rm from $si:$sp via $proto to $ru\n");
    
    # Initial sanity checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    
    if(!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed SIP message from $si:$sp\n");
        exit;
    }
    
#!ifdef WITH_WEBSOCKETS
    # Handle WebSocket connections
    if (proto == WS || proto == WSS) {
        xlog("L_INFO", "SIP over WebSocket from $si:$sp\n");
        setflag(6); # Mark as WebSocket
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            # Add a Contact alias only when the message has an unaliased
            # Contact. ACK and other requests may legitimately omit Contact.
            if (is_present_hf("Contact") && !($ct =~ ";alias=")) {
                if (!add_contact_alias()) {
                    xlog("L_ERR", "Error aliasing contact <$ct>\n");
                    sl_send_reply("400", "Bad Request");
                    exit;
                }
            }
        }
    }
#!endif
   
    # Handle CANCEL requests
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    
    # Absorb retransmissions instead of forwarding the same request again.
    # ACK is handled below because a 2xx ACK is a separate transaction.
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }
    
    # NAT handling for all requests
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
        setflag(5); # Mark as NATed
       # RTPengine is the sole SDP rewriter. Running fix_nated_sdp() here as
       # well can corrupt the body before the WebRTC conversion takes place.
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE-TRACE ingress: call-id=$ci from=$fu to=$tu r-uri=$ru src=$si:$sp dst-socket=$fs next-hop=$du route=$hdr(Route)\n");
    }

    # Handle sequential requests (in-dialog)
    if (has_totag()) {
        # ACK handling - CRITICAL FIX
        if (is_method("ACK")) {
            xlog("L_INFO", "ACK: Processing ACK from $si:$sp to $ru (Call-ID: $ci)\n");
            
            # A non-2xx ACK matches the INVITE transaction.
            if (t_check_trans()) {
                xlog("L_INFO", "ACK: Matched to transaction, relaying\n");
                route(RELAY);
                exit;
            }
            
            # If no transaction match, try loose_route for in-dialog ACK
            if (loose_route()) {
                xlog("L_INFO", "ACK: Loose route success, relaying\n");
                
#!ifdef WITH_WEBSOCKETS
                if ($ru =~ ";alias=") {
                    # loose_route() may leave Kamailio's own Record-Route in
                    # $du. The Contact alias is the authoritative destination
                    # for the browser's existing WS/WSS connection.
                    xlog("L_INFO", "ALIAS before: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
                    $du = $null;
                    $fs = $null;
                    if (!handle_ruri_alias()) {
                        xlog("L_ERR", "ACK alias failed: ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
                        exit;
                    }
                    xlog("L_INFO", "ALIAS after: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
                }
#!endif
                route(RELAY);
                exit;
            }
            
            # ACK without matching transaction or route - absorb it
            xlog("L_WARN", "ACK: No transaction or route match, absorbing\n");
            exit;
        }
        
        # All other in-dialog requests
        if (loose_route()) {
            xlog("L_INFO", "IN-DIALOG: $rm routed via Record-Route\n");
            
#!ifdef WITH_WEBSOCKETS
            # The WebRTC Contact uses a .invalid host. Always resolve its
            # alias to the live WS/WSS connection, even when loose_route()
            # has already populated $du from a Record-Route header.
            if ($ru =~ ";alias=") {
                xlog("L_INFO", "ALIAS before: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
                $du = $null;
                $fs = $null;
                if (!handle_ruri_alias()) {
                    xlog("L_ERR", "Alias failed: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
                    sl_send_reply("400", "Bad Request");
                    exit;
                }
                xlog("L_INFO", "ALIAS after: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci\n");
            }
#!endif
            
            if (is_method("INVITE")) {
                # Re-INVITE - handle media changes
                xlog("L_INFO", "RE-INVITE: Handling media update\n");
                route(NATMANAGE);
            }
            
            route(RELAY);
        } else {
            xlog("L_WARN", "IN-DIALOG: Request has totag but loose_route failed\n");
            sl_send_reply("404", "Not here");
        }
        exit;
    }
    
    # Record routing for dialog forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        remove_hf("Route");
        # Add one Record-Route using the public address.
        if (!is_myself("$si")) {
            # External client - use public IP in Record-Route
            record_route_advertised_address("213.199.52.39");
            xlog("L_INFO", "RECORD-ROUTE: Added with public IP for external client\n");
        } else {
            # Internal - use regular record route
            record_route();
            xlog("L_INFO", "RECORD-ROUTE: Added for internal client\n");
        }
    }
    
    # Handle registrations
    if (is_method("REGISTER")) {
        route(AUTH);
        route(REGISTRAR);
        exit;
    }
    
    # Authentication for other requests
    route(AUTH);
    
    # Handle INVITE
    if (is_method("INVITE")) {
        t_on_reply("MANAGE_REPLY");
        t_on_failure("MISSED_CALL");
        t_on_branch("BRANCH_TRACE");
    }

    # Check for FreeSWITCH media services
    #!ifdef WITH_FREESWITCH
    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE-TRACE before FSDISPATCH: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
    }
    route(FSDISPATCH);
    $avp(callee) = $rU;
    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE-TRACE after FSDISPATCH: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs callee=$avp(callee)\n");
    }
    #!endif

    # Browser or external INVITEs should enter FreeSWITCH first so it can
    # create the call UUID and handle recording/bridging.
    if (is_method("INVITE") && !is_myself("$si")) {
        xlog("L_INFO", "INVITE-TRACE routing external INVITE to FreeSWITCH first: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
        route(FSRELAY);
        exit;
    }

    # User location lookup
    if (!lookup("location")) {
        # Preserve lookup's return code because later functions overwrite $rc.
        $var(lookup_rc) = $rc;
        xlog("L_WARN", "LOCATION: lookup failed for user=$rU rc=$var(lookup_rc) call-id=$ci\n");
        #!ifdef WITH_FREESWITCH
    #    if (is_method("INVITE")) {
     #       route(FSVBOX);
      #      exit;
       # }
        #!endif
        
        if ($var(lookup_rc) == -2) {
            sl_send_reply("405", "Method Not Allowed");
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    # Allocate media only after the registered destination was found.
    if (is_method("INVITE")) {
        xlog("L_INFO", "LOCATION: found contact for user=$rU, destination=$du\n");
        route(NATMANAGE);
        xlog("L_INFO", "INVITE-TRACE after lookup/NATMANAGE: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
    }
    
    #!ifdef WITH_FREESWITCH
    if (is_method("INVITE")) {
        t_on_failure("FAIL_FSVBOX");
    }
    #!endif
    
    # Ensure all INVITEs are properly relayed via TM (transaction)
    if (is_method("INVITE") && !t_is_set("branch_route")) {
        xlog("L_INFO", "SAFETY: Forcing t_relay() for INVITE $ci to ensure transaction is tracked\n");
        t_relay();
        exit;
    }

    route(RELAY);
}

# NAT and RTPEngine Management Route
route[NATMANAGE] {
    xlog("L_INFO", "NATMANAGE: Processing $rm from $si:$sp (proto=$proto) to $ru\n");
    
    if (is_method("INVITE")) {
        # Determine caller transport type
        if (proto == WS || proto == WSS || isflagset(6)) {
            xlog("L_INFO", "RTPENGINE: Caller is WebRTC (WebSocket)\n");
            $avp(caller_is_webrtc) = 1;
        } else {
            xlog("L_INFO", "RTPENGINE: Caller is regular SIP\n");
            $avp(caller_is_webrtc) = 0;
        }
        
        # Determine callee transport type by checking destination
        if ($ru =~ "transport=ws") {
            xlog("L_INFO", "RTPENGINE: Callee is WebRTC (WebSocket)\n");
            $avp(callee_is_webrtc) = 1;
        } else {
            xlog("L_INFO", "RTPENGINE: Callee is regular SIP\n");
            $avp(callee_is_webrtc) = 0;
        }
        
        # Build RTPEngine offer flags. The profile describes the SDP sent to
        # the callee, not the SDP received from the caller.
        $var(rtpengine_flags) = "replace-origin replace-session-connection";
        
        # Caller WebRTC -> Callee SIP: Strip WebRTC, send RTP
        if ($avp(caller_is_webrtc) == 1 && $avp(callee_is_webrtc) == 0) {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " RTP/AVP ICE=remove DTLS=off SDES=off codec-strip=VP8 codec-strip=VP9";
            xlog("L_INFO", "RTPENGINE OFFER: WebRTC to SIP - stripping WebRTC features\n");
        }
        # Caller SIP -> Callee WebRTC: convert the INVITE offer before WSS.
        else if ($avp(caller_is_webrtc) == 0 && $avp(callee_is_webrtc) == 1) {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " UDP/TLS/RTP/SAVPF ICE=force DTLS=passive SDES=off rtcp-mux-offer";
            xlog("L_INFO", "RTPENGINE OFFER: SIP to WebRTC - generating WebRTC offer\n");
        }
        else if ($avp(caller_is_webrtc) == 1) {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " UDP/TLS/RTP/SAVPF ICE=force DTLS=passive SDES=off rtcp-mux-offer";
            xlog("L_INFO", "RTPENGINE OFFER: Same transport type\n");
        } else {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " RTP/AVP ICE=remove DTLS=off SDES=off";
            xlog("L_INFO", "RTPENGINE OFFER: Same transport type\n");
        }
        
        if (!rtpengine_offer($var(rtpengine_flags))) {
            xlog("L_ERR", "RTPENGINE offer failed: $var(rtpengine_flags)\n");
            sl_send_reply("488", "Not Acceptable Here");
            exit;
        } else {
            xlog("L_INFO", "RTPENGINE offer success: $var(rtpengine_flags)\n");
        }
    }
    
    return;
}

# Authentication route
route[AUTH] {
    #!ifdef WITH_AUTH
    # Trust the local FreeSWITCH bridge leg so Kamailio can perform
    # subscriber lookup/dispatch without forcing an auth challenge back
    # to FreeSWITCH.
    if ($si == "213.199.52.39" || $si == "127.0.0.1") {
        xlog("L_INFO", "AUTH: trusted FreeSWITCH source $si:$sp, skipping auth for call-id=$ci\n");
        return;
    }

    if (is_method("REGISTER")) {
        if (!www_authorize("sip.classyra.com.ng", "subscriber")) {
            www_challenge("sip.classyra.com.ng", "0");
            exit;
        }
        if ($au != $tU) {
            sl_send_reply("403", "Forbidden auth ID");
            exit;
        }
    } else {
        if (from_uri==myself) {
            if (!proxy_authorize("sip.classyra.com.ng", "subscriber")) {
                proxy_challenge("sip.classyra.com.ng", "0");
                exit;
            }
            if ($au != $fU) {
                sl_send_reply("403", "Forbidden auth ID");
                exit;
            }
            consume_credentials();
        }
    }
    #!endif
    return;
}

# Registration route
route[REGISTRAR] {
    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

# FreeSWITCH dispatch route
#!ifdef WITH_FREESWITCH
route[FSDISPATCH] {
    if (!is_method("INVITE")) {
        return;
    }

    xlog("L_INFO", "FSDISPATCH-TRACE start: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");

if ($rU == "439666") {
    $rU = "9666";
    xlog("L_INFO", "TEST: Direct forwarding 439666 as 9666 to FreeSWITCH\n");
    route(FSRELAY);
    exit;
}    
    # Check for media service extensions (4xxxx)
    if (!(($rU =~ "^4[0-9]+$"))) {
        xlog("L_INFO", "FSDISPATCH-TRACE not routed to FreeSWITCH: call-id=$ci r-uri=$ru du=$du fs=$fs reason=non-4xxx-extension\n");
        return;
    }
    
    xlog("L_INFO", "Routing to FreeSWITCH media service: $rU\n");
    if ($rU == "43300") {
    xlog("L_INFO", "TEST: Direct forwarding 43300 to FreeSWITCH\n");
    route(FSRELAY);
    exit;
}    

    # Route based on extension
    if($rU =~ "^41$") {
        if ($au == $null) {
            sl_send_reply("403", "Authentication required");
            exit;
        }
        $rU = "vm-" + $au;
        route(FSRELAY);
        exit;
    } else if($rU =~ "^441[0-9][0-9]$") {
        $rU = $(rU{s.substr,2,0});
        route(FSVBOX);
        exit;
    } else if($rU =~ "^433[0-9][0-9][0-9]$") {
        $rU = $(rU{s.substr,2,0});
    } else if($rU =~ "^45[0-9]+$") {
        # Keep the full conference number intact so FreeSWITCH sees the exact room code.
        # Stripping the prefix turns 45111 into 111 and breaks dynamic conference routing.
        xlog("L_INFO", "FSDISPATCH: preserving conference number $rU for FreeSWITCH\n");
    } else {
        xlog("L_INFO", "FSDISPATCH-TRACE not routed to FreeSWITCH: call-id=$ci r-uri=$ru du=$du fs=$fs reason=pattern-miss\n");
        return;
    }
    
    xlog("L_INFO", "FSDISPATCH-TRACE selected FreeSWITCH: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
    route(FSRELAY);
    exit;
}

# FreeSWITCH voicemail route
route[FSVBOX] {
    if (!(($rU =~ "^1[0-9][0-9]+$"))) {
        return;
    }
    
    $rU = "vb-" + $rU;
    route(FSRELAY);
    exit;
}

# Send to FreeSWITCH
route[FSRELAY] {
   # $du = "sip:127.0.0.1:5080";
    $du = "sip:213.199.52.39:5080";
    xlog("L_INFO", "FSRELAY-TRACE forwarding to FreeSWITCH: call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
    route(NATMANAGE);
    route(RELAY);
    exit;
}
#!endif

# Main relay route
route[RELAY] {
    if (isflagset(5) || isflagset(6)) {
        force_rport();
    }

    xlog("L_INFO", "RELAY enter: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci from=$fu to=$tu src=$si:$sp\n");

    if (is_method("ACK|BYE")) {
        xlog("L_INFO", "RELAY before: method=$rm ru=$ru du=$du fs=$fs rc=$rc call-id=$ci from=$fu to=$tu src=$si:$sp\n");
    }

    if (!t_relay()) {
        $var(relay_rc) = $rc;
        xlog("L_ERR", "RELAY failed: method=$rm ru=$ru du=$du fs=$fs rc=$var(relay_rc) from=$si:$sp call-id=$ci from-tag=$ft to-tag=$tt\n");

        # ACK cannot receive an error response. For BYE and other requests,
        # preserve normal SIP error handling and leave RTPengine intact.
        if (!is_method("ACK")) {
            sl_reply_error();
        }
        exit;
    }

    $var(relay_rc) = $rc;
    xlog("L_INFO", "RELAY success: method=$rm ru=$ru du=$du fs=$fs rc=$var(relay_rc) call-id=$ci from=$fu to=$tu src=$si:$sp\n");
    if (is_method("ACK|BYE")) {
        xlog("L_INFO", "RELAY accepted: method=$rm ru=$ru du=$du fs=$fs rc=$var(relay_rc) call-id=$ci from=$fu to=$tu src=$si:$sp\n");
    }

    # Delete media only after Kamailio has accepted the BYE for relay.
    if (is_method("BYE")) {
        rtpengine_delete();
        xlog("L_INFO", "RTPENGINE deleted after BYE relay acceptance: call-id=$ci\n");
    }
    exit;
}

branch_route[BRANCH_TRACE] {
    xlog("L_INFO", "BRANCH-TRACE: call-id=$ci method=$rm from=$fu to=$tu r-uri=$ru branch-du=$du branch-fs=$fs src=$si:$sp\n");
}

# RTPEngine Reply Route - FIXED
onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "REPLY: $rs $rr for $rm call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs from $si:$sp (proto=$proto)\n");

    # The global onreply_route adds the WebSocket Contact alias. Do not add
    # it again here or sequential requests will contain duplicate aliases.
    
    # CRITICAL FIX: Only process specific response codes that typically have SDP
    if (is_method("INVITE") && (status=~"(183|200)" || (status=~"18[0-9]" && has_body("application/sdp")))) {
        
        # Double-check for SDP body before processing
        if (!has_body("application/sdp")) {
            xlog("L_INFO", "RTPENGINE: Skipping $rs response - no SDP body\n");
            return;
        }
        
        xlog("L_INFO", "RTPENGINE: Processing $rs response with SDP\n");
        
        # Build answer flags based on callee transport
        $var(rtpengine_flags) = "replace-origin replace-session-connection";
        
        # A WebRTC callee answered a SIP caller: convert its answer back to RTP.
        if ($avp(callee_is_webrtc) == 1) {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " RTP/AVP ICE=remove DTLS=off SDES=off";
            xlog("L_INFO", "RTPENGINE ANSWER: Converting WebRTC answer to RTP\n");
        } 
        # If caller was WebRTC but callee is SIP, answer is plain RTP
        else if ($avp(caller_is_webrtc) == 1 && $avp(callee_is_webrtc) == 0) {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " UDP/TLS/RTP/SAVPF ICE=force DTLS=passive SDES=off rtcp-mux-offer";
            xlog("L_INFO", "RTPENGINE ANSWER: Adding WebRTC features back for WebRTC caller\n");
        }
        # Regular SIP to SIP
        else {
            $var(rtpengine_flags) = $var(rtpengine_flags) + " RTP/AVP";
            xlog("L_INFO", "RTPENGINE ANSWER: Regular SIP answer\n");
        }
        
        if (!rtpengine_answer($var(rtpengine_flags))) {
            xlog("L_ERR", "RTPENGINE answer failed: $var(rtpengine_flags)\n");
            drop;
        } else {
            xlog("L_INFO", "RTPENGINE answer success: $var(rtpengine_flags) call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs\n");
        }
    } else if (is_method("INVITE")) {
        xlog("L_INFO", "RTPENGINE: Skipping $rs response (no SDP processing needed)\n");
    }
}

# Failure route for missed calls
failure_route[MISSED_CALL] {
    if (t_is_canceled()) {
        exit;
    }
    
    # Clean up RTPEngine session on failure
    rtpengine_delete();
    xlog("L_INFO", "MISSED_CALL: cleaned up RTPEngine session call-id=$ci from=$fu to=$tu r-uri=$ru du=$du fs=$fs src=$si:$sp\n");
}

#!ifdef WITH_WEBSOCKETS
onreply_route {
    if ((($Rp == 8080 || $Rp == 7443) && !(proto == WS || proto == WSS))) {
        xlog("L_WARN", "SIP response on $Rp\n");
        drop;
    }
    
    if ((proto == WS || proto == WSS)
        && is_present_hf("Contact")
        && !($ct =~ ";alias=")) {
        xlog("L_INFO", "SIP reply over WebSocket to $si:$sp\n");
        if (!add_contact_alias()) {
            xlog("L_ERR", "Error aliasing reply Contact <$ct> call-id=$ci\n");
        }
    }
}

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();
    
    if ($Rp != 8080
#!ifdef WITH_TLS
    && $Rp != 7443
#!endif
    ) {
        xlog("L_WARN", "HTTP request on $Rp\n");
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    
    xlog("L_INFO", "HTTP Request: $rm $ru from $si:$sp\n");
    
    if ($hdr(Upgrade)=~"websocket"
    && $hdr(Connection)=~"Upgrade"
    && $rm=~"GET") {
        
        if ($hdr(Host) == $null) {
            xlog("L_WARN", "Missing Host header\n");
            xhttp_reply("400", "Bad Request", "", "");
            exit;
        }
        
        xlog("L_INFO", "WebSocket handshake from $si:$sp\n");
        
        if (ws_handle_handshake()) {
            xlog("L_INFO", "WebSocket handshake successful\n");
            exit;
        }
    }
    
    xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket connection from $si:$sp closed\n");
}
#!endif

#!ifdef WITH_FREESWITCH
failure_route[FAIL_FSVBOX] {
    if (t_check_status("487")) {
        exit;
    }
    
    if (t_check_status("486|408|480")) {
        xlog("L_INFO", "FAIL_FSVBOX: routing to voicemail call-id=$ci callee=$avp(callee) from=$fu to=$tu r-uri=$ru du=$du fs=$fs src=$si:$sp\n");
        $rU = $avp(callee);
        route(FSVBOX);
    }
}
#!endif
